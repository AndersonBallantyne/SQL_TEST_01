name: CI

on:
  push:
  pull_request:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      eval: ${{ steps.filter.outputs.eval }}
    steps:
      # fetch-depth: 0 (full history), not the default shallow depth-1 clone - paths-filter
      # needs to compute a merge-base against the previous commit on this same branch for a
      # plain push event (it can only use the GitHub API, no checkout needed, for pull_request
      # events - push events require real git history to diff against).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            eval:
              - 'src/agent.py'
              - 'src/tools.py'
              - 'src/verify_answer.py'
              - 'src/eval_cases*.py'
              - 'src/verify_eval_cases.py'
              - 'src/run_eval.py'
              - 'src/run_verify_eval.py'

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: devuser
          POSTGRES_PASSWORD: ci_admin_pw
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: ci_admin_pw
      POSTGRES_DB: appdb
      # Throwaway credentials scoped to this one ephemeral service container, destroyed at
      # job end - not real secrets, so no GitHub Actions secret store needed for these.
      POSTGRES_READER_USER: appdb_reader
      POSTGRES_READER_PASSWORD: ci_reader_pw
      POSTGRES_AGENT_WRITER_USER: appdb_agent_writer
      POSTGRES_AGENT_WRITER_PASSWORD: ci_writer_pw

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run schema migrations
        run: |
          export PGPASSWORD="$POSTGRES_PASSWORD"
          for f in migrations/001_schema.sql migrations/002_seed.sql migrations/003_readonly_role.sql \
                   migrations/004_raw_schema.sql migrations/005_clean_schema.sql \
                   migrations/006_agent_scratch_role.sql migrations/007_agent_scratch_schema.sql \
                   migrations/008_add_summary_embedding.sql migrations/009_add_summary_embedding_hnsw_index.sql \
                   migrations/010_docs_chunks_schema.sql migrations/011_metrics_history_schema.sql \
                   migrations/012_chat_rounds_schema.sql migrations/013_allocation_items_schema.sql \
                   migrations/014_scratch_table_metadata.sql migrations/015_demo_token_log.sql; do
            echo "Applying $f"
            psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f "$f"
          done

      - name: Set CI-only passwords for the reader/writer roles
        # Locally these are set once by hand (see CREDENTIALS.local.md) since no migration
        # file carries a password in cleartext on purpose - CI has no such manual step, so it
        # sets its own throwaway values here instead, immediately after the roles are created.
        run: |
          export PGPASSWORD="$POSTGRES_PASSWORD"
          psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c \
            "ALTER ROLE appdb_reader WITH PASSWORD '$POSTGRES_READER_PASSWORD';"
          psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c \
            "ALTER ROLE appdb_agent_writer WITH PASSWORD '$POSTGRES_AGENT_WRITER_PASSWORD';"

      # data/ALLOCATION-synthesized.csv (committed, safe to be public) is now the one official
      # dataset for the whole project - CI and local dev use the exact same file via ingest.py's
      # default, so there's no separate fixture concept left to keep in sync.
      - name: Ingest the official dataset
        run: python src/ingest.py

      - name: Transform raw -> clean
        run: python src/transform.py

      - name: Build normalized allocation items
        run: python src/build_allocation_items.py

      - name: Embed allocation summaries
        run: python src/embed_summaries.py

      - name: Extract & embed doc chunks
        run: |
          python src/extract_doc_chunks.py
          python src/embed_chunks.py

      - name: Run pytest
        run: pytest -v

  eval:
    # Runs only on a merge to main that actually touches agent or verifier behavior (agent.py,
    # tools.py, verify_answer.py, eval_cases*.py, verify_eval_cases.py) - both conditions decided
    # explicitly earlier in Build 5: the real cost of a full eval run is cents on
    # claude-haiku-4-5, but running it on every WIP push would still be pure noise, and
    # ANTHROPIC_API_KEY becoming a live Actions secret is worth minimizing exposure on.
    # `needs: test` also means this never fires against a build that already failed its
    # regular tests.
    needs: [test, detect-changes]
    if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.eval == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: devuser
          POSTGRES_PASSWORD: ci_admin_pw
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: ci_admin_pw
      POSTGRES_DB: appdb
      POSTGRES_READER_USER: appdb_reader
      POSTGRES_READER_PASSWORD: ci_reader_pw
      POSTGRES_AGENT_WRITER_USER: appdb_agent_writer
      POSTGRES_AGENT_WRITER_PASSWORD: ci_writer_pw
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Each GitHub Actions job gets its own fresh runner and service container, so the eval
      # job can't reuse the `test` job's already-populated database - this repeats the same
      # migrate/ingest/transform/embed pipeline. Real duplicated compute, but this job only
      # fires on a relevant merge to main, not every push, so it's a fine tradeoff at this scale.
      - name: Run schema migrations
        run: |
          export PGPASSWORD="$POSTGRES_PASSWORD"
          for f in migrations/001_schema.sql migrations/002_seed.sql migrations/003_readonly_role.sql \
                   migrations/004_raw_schema.sql migrations/005_clean_schema.sql \
                   migrations/006_agent_scratch_role.sql migrations/007_agent_scratch_schema.sql \
                   migrations/008_add_summary_embedding.sql migrations/009_add_summary_embedding_hnsw_index.sql \
                   migrations/010_docs_chunks_schema.sql migrations/011_metrics_history_schema.sql \
                   migrations/012_chat_rounds_schema.sql migrations/013_allocation_items_schema.sql \
                   migrations/014_scratch_table_metadata.sql migrations/015_demo_token_log.sql; do
            echo "Applying $f"
            psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f "$f"
          done

      - name: Set CI-only passwords for the reader/writer roles
        run: |
          export PGPASSWORD="$POSTGRES_PASSWORD"
          psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c \
            "ALTER ROLE appdb_reader WITH PASSWORD '$POSTGRES_READER_PASSWORD';"
          psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c \
            "ALTER ROLE appdb_agent_writer WITH PASSWORD '$POSTGRES_AGENT_WRITER_PASSWORD';"

      - name: Ingest the official dataset
        run: python src/ingest.py

      - name: Transform raw -> clean
        run: python src/transform.py

      - name: Build normalized allocation items
        run: python src/build_allocation_items.py

      - name: Embed allocation summaries
        run: python src/embed_summaries.py

      - name: Extract & embed doc chunks
        run: |
          python src/extract_doc_chunks.py
          python src/embed_chunks.py

      - name: Run eval harness (round 1)
        run: python src/run_eval.py

      - name: Run eval harness (round 2)
        run: python src/run_eval.py eval_cases_round2

      # Build 7 added a second agent (the verifier) with its own eval harness - this never got
      # wired into CI when it was built (found 2026-08-05 during a full project audit, same bug
      # class as the migration-list staleness fix above: a new capability shipped without its
      # own CI coverage). Confirms the verifier's grounded/ungrounded judgment stays correct,
      # not just that the main agent's answers do.
      - name: Run verifier eval harness
        run: python src/run_verify_eval.py
