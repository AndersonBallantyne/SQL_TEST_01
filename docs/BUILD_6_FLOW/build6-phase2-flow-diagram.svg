<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1300" width="680" height="1300" role="img" aria-labelledby="title desc">
  <title id="title">Build 6, Phase 2 flow: hybrid tiered conversation memory</title>
  <desc id="desc">Flowchart: start, a checkpoint confirming the Phase 1 sunk-cost decision and the hybrid-memory scope are both confirmed, adding a fidelity-cap constant and a flatten/collapse helper to agent.py, threading history_rounds through ask_agent so it returns this round's full trace, unit testing the helper with mocked rounds, adding round-tracking and history construction to app.py, running the app and live-testing a follow-up question that depends on a prior tool result, a decision checking that temporarily lowering the fidelity cap makes older rounds collapse correctly, then continue to Phase 3. Every step box is tagged YOURS, marking it as a hands-on deliverable, not something done unilaterally.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #101827; }
    .heading    { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 22px; font-weight: 600; }
    .subheading { font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace; font-size: 11px; fill: #7C8894; letter-spacing: 0.12em; }
    .step-label { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 16.5px; font-weight: 600; }
    .step-desc  { font-size: 13px; fill: #4B5768; }
    .step-mono  { font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace; font-size: 12.5px; fill: #7C8894; }
    .decision-title { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 16.5px; font-weight: 600; text-anchor: middle; }
    .decision-q     { font-size: 12.5px; fill: #B5502B; text-anchor: middle; font-weight: 600; }
    .legend-text { font-size: 11px; fill: #7C8894; }
    .rect-node   { fill: #FFFFFF; stroke: #B9C4C7; stroke-width: 1.5; }
    .diamond-node{ fill: #F7E9E2; stroke: #B5502B; stroke-width: 1.5; }
    .pill-node   { fill: #0B5158; }
    .pill-text   { fill: #F3F9F9; font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace; font-size: 13.5px; font-weight: 700; text-anchor: middle; letter-spacing: 0.04em; }
    .badge       { fill: #0B5158; }
    .badge-text  { fill: #F3F9F9; font-size: 14px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .arrow-line  { stroke: #B9C4C7; stroke-width: 2; }
    .arrow-head  { fill: #B9C4C7; }
    .tag-mine    { fill: #0B5158; }
    .tag-yours   { fill: #B5502B; }
    .tag-text    { fill: #F3F9F9; font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace; font-size: 9.5px; font-weight: 700; text-anchor: middle; letter-spacing: 0.06em; }
  </style>

  <rect x="0" y="0" width="680" height="1300" fill="#F3F6F7"/>

  <text x="340" y="40" class="heading" text-anchor="middle">Build 6, Phase 2 — Hybrid Tiered Memory</text>
  <text x="340" y="60" class="subheading" text-anchor="middle">FRONT END FOR THE AGENT · BUILD 6</text>

  <!-- legend -->
  <g>
    <rect x="16" y="76" width="20" height="12" rx="6" class="pill-node"/>
    <text x="42" y="86" class="legend-text">start / end</text>
    <polygon points="150,73 166,82 150,91 134,82" class="diamond-node"/>
    <text x="172" y="86" class="legend-text">checkpoint</text>
    <rect x="270" y="76" width="20" height="12" rx="3" class="rect-node"/>
    <text x="296" y="86" class="legend-text">step</text>
    <line x1="350" y1="82" x2="378" y2="82" class="arrow-line"/>
    <polygon points="384,82 376,78 376,86" class="arrow-head"/>
    <text x="390" y="86" class="legend-text">flow</text>
    <rect x="440" y="75" width="38" height="14" rx="7" class="tag-mine"/>
    <text x="459" y="85" class="tag-text">MINE</text>
    <rect x="520" y="75" width="42" height="14" rx="7" class="tag-yours"/>
    <text x="541" y="85" class="tag-text">YOURS</text>
  </g>

  <!-- connectors -->
  <g>
    <line class="arrow-line" x1="340" y1="170" x2="340" y2="210"/>
    <polygon class="arrow-head" points="340,216 334,206 346,206"/>

    <line class="arrow-line" x1="340" y1="346" x2="340" y2="386"/>
    <polygon class="arrow-head" points="340,392 334,382 346,382"/>

    <line class="arrow-line" x1="340" y1="470" x2="340" y2="510"/>
    <polygon class="arrow-head" points="340,516 334,506 346,506"/>

    <line class="arrow-line" x1="340" y1="594" x2="340" y2="634"/>
    <polygon class="arrow-head" points="340,640 334,630 346,630"/>

    <line class="arrow-line" x1="340" y1="718" x2="340" y2="758"/>
    <polygon class="arrow-head" points="340,764 334,754 346,754"/>

    <line class="arrow-line" x1="340" y1="842" x2="340" y2="882"/>
    <polygon class="arrow-head" points="340,888 334,878 346,878"/>

    <line class="arrow-line" x1="340" y1="966" x2="340" y2="1006"/>
    <polygon class="arrow-head" points="340,1012 334,1002 346,1002"/>

    <line class="arrow-line" x1="340" y1="1142" x2="340" y2="1182"/>
    <polygon class="arrow-head" points="340,1188 334,1178 346,1178"/>
  </g>

  <!-- Start pill -->
  <g>
    <rect class="pill-node" x="180" y="110" width="320" height="60" rx="30"/>
    <text class="pill-text" x="340" y="145">START — BUILD 6, PHASE 2</text>
  </g>

  <!-- Decision: Phase 1 / scope checkpoint -->
  <g>
    <polygon class="diamond-node" points="340,216 500,281 340,346 180,281"/>
    <circle class="badge" cx="96" cy="281" r="16"/>
    <text class="badge-text" x="96" y="282">0</text>
    <text class="decision-title" x="340" y="275">Scope check</text>
    <text class="decision-q" x="340" y="296">Phase 1 sunk cost, hybrid scope confirmed?</text>
  </g>

  <!-- Step 1 -->
  <g>
    <rect class="rect-node" x="60" y="392" width="560" height="78" rx="10"/>
    <circle class="badge" cx="96" cy="428" r="16"/>
    <text class="badge-text" x="96" y="429">1</text>
    <text class="step-label" x="126" y="422">Add fidelity cap + collapse helper (agent.py)</text>
    <text class="step-mono" x="126" y="444">MAX_FULL_FIDELITY_ROUNDS + flatten_history() helper</text>
    <rect class="tag-yours" x="556" y="404" width="52" height="18" rx="9"/>
    <text class="tag-text" x="582" y="416">YOURS</text>
  </g>

  <!-- Step 2 -->
  <g>
    <rect class="rect-node" x="60" y="516" width="560" height="78" rx="10"/>
    <circle class="badge" cx="96" cy="552" r="16"/>
    <text class="badge-text" x="96" y="553">2</text>
    <text class="step-label" x="126" y="546">Thread history_rounds through ask_agent()</text>
    <text class="step-mono" x="126" y="568">builds messages via helper, returns this round's full trace</text>
    <rect class="tag-yours" x="556" y="528" width="52" height="18" rx="9"/>
    <text class="tag-text" x="582" y="540">YOURS</text>
  </g>

  <!-- Step 3 -->
  <g>
    <rect class="rect-node" x="60" y="640" width="560" height="78" rx="10"/>
    <circle class="badge" cx="96" cy="676" r="16"/>
    <text class="badge-text" x="96" y="677">3</text>
    <text class="step-label" x="126" y="670">Unit test the flatten/collapse helper</text>
    <text class="step-mono" x="126" y="692">mock rounds in, assert correct messages structure out</text>
    <rect class="tag-yours" x="556" y="652" width="52" height="18" rx="9"/>
    <text class="tag-text" x="582" y="664">YOURS</text>
  </g>

  <!-- Step 4 -->
  <g>
    <rect class="rect-node" x="60" y="764" width="560" height="78" rx="10"/>
    <circle class="badge" cx="96" cy="800" r="16"/>
    <text class="badge-text" x="96" y="801">4</text>
    <text class="step-label" x="126" y="794">Add round-tracking + history build (app.py)</text>
    <text class="step-mono" x="126" y="816">new session_state struct, slices last-N full + rest collapsed</text>
    <rect class="tag-yours" x="556" y="776" width="52" height="18" rx="9"/>
    <text class="tag-text" x="582" y="788">YOURS</text>
  </g>

  <!-- Step 5 -->
  <g>
    <rect class="rect-node" x="60" y="888" width="560" height="78" rx="10"/>
    <circle class="badge" cx="96" cy="924" r="16"/>
    <text class="badge-text" x="96" y="925">5</text>
    <text class="step-label" x="126" y="918">Run app, live-test a tool-dependent follow-up</text>
    <text class="step-mono" x="126" y="940">streamlit run app.py — confirms real memory, not just recap</text>
    <rect class="tag-yours" x="556" y="900" width="52" height="18" rx="9"/>
    <text class="tag-text" x="582" y="912">YOURS</text>
  </g>

  <!-- Decision: boundary test -->
  <g>
    <polygon class="diamond-node" points="340,1012 500,1077 340,1142 180,1077"/>
    <circle class="badge" cx="96" cy="1077" r="16"/>
    <text class="badge-text" x="96" y="1078">6</text>
    <text class="decision-title" x="340" y="1071">Boundary test</text>
    <text class="decision-q" x="340" y="1092">lower cap, older rounds collapse correctly?</text>
  </g>

  <!-- End pill -->
  <g>
    <rect class="pill-node" x="180" y="1188" width="320" height="66" rx="33"/>
    <text class="pill-text" x="340" y="1218">CONTINUE →</text>
    <text class="pill-text" x="340" y="1238">PHASE 3</text>
  </g>
</svg>
