services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: pg_local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: mssql_local
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql


  agent:
    build: .
    container_name: askdb_agent
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres

  streamlit_app:
    build: .
    container_name: askdb_streamlit
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
    command: ["streamlit", "run", "src/app.py", "--server.address=0.0.0.0"]


volumes:
  pgdata:
  mssqldata: