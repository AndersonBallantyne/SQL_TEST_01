[pytest]
# Scopes discovery to the project's actual test-file convention (test_*.py) rather than
# pytest's broader default, which also matches *_test.py - that default is what let a stray
# non-test script (api_test.py, a one-off Anthropic API connectivity check with no test
# functions at all) get silently collected and executed by a bare `pytest` invocation.
python_files = test_*.py
