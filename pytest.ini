[pytest]
# Scopes discovery to the project's actual test-file convention (test_*.py) rather than
# pytest's broader default, which also matches *_test.py - that default is what let a stray
# non-test script (api_test.py, a one-off Anthropic API connectivity check with no test
# functions at all) get silently collected and executed by a bare `pytest` invocation.
python_files = test_*.py

# Tests live in tests/, importable modules (tools, agent, logging_utils, verify_answer, ...)
# live in src/ - neither directory is a package (no __init__.py, matching every script's plain
# `python src/whatever.py` invocation elsewhere in this project). pythonpath puts src/ on
# sys.path for the test session so `import tools` etc. resolves without either directory
# needing __init__.py or the test files needing sys.path hacks of their own.
testpaths = tests
pythonpath = src
